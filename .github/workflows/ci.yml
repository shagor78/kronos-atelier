name: Production CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci-build-and-test:
    name: Lint, Format, Unit/Integration Tests, Security & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Python Quality & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: TypeScript Strict Type Check (Lint)
        run: npm run lint

      - name: Python Flake8 Lint Check
        run: flake8 backend/

      - name: Python Black Formatting Check
        run: black --check backend/

      - name: Python Bandit Security Static Analysis
        run: bandit -r backend/src/

      - name: Run Python Unit Tests (Pytest)
        run: pytest

      - name: Run Backend API & RBAC Integration Tests
        run: npm test

      - name: Run Frontend Architecture & Separation Tests
        run: npx tsx --test frontend/tests/storefront.test.ts

      - name: Run Bash Security Audit & Health Verification
        run: |
          bash ./scripts/security-check.sh
          bash ./scripts/health-check.sh

      - name: Build Production Frontend Bundle
        run: npm run build
