name: Production CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# অটো-কমিটের জন্য রুট লেভেলে রাইট পারমিশন প্রয়োজন
permissions:
  contents: write

jobs:
  ci-build-and-test:
    name: Lint, Format, Unit/Integration Tests, Security & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # পুশ করার জন্য অরিজিনাল চ্যানেল ধরে রাখতে
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Python Quality & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Auto-format Python code with Black
        run: |
          black backend/
          
          # যদি কোনো ফাইলে পরিবর্তন এসে থাকে তবে তা অটোমেটিক কমিট ও পুশ হবে
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add backend/
            git commit -m "style: auto-format backend code with black [skip ci]"
            git push
          else
            echo "No formatting changes needed."
          fi

      - name: Python Flake8 Lint Check
        run: flake8 backend/

      - name: Python Bandit Security Static Analysis
        run: bandit -r backend/src/

      - name: Run Python Unit Tests (Pytest)
        run: pytest

      - name: Run Backend API & RBAC Integration Tests
        run: npm test

      - name: Run Frontend Architecture & Separation Tests
        run: npx tsx --test frontend/tests/storefront.test.ts

      - name: Run Bash Security Audit & Health Verification
        run: |
          bash ./scripts/security-check.sh
          bash ./scripts/health-check.sh

      - name: Build Production Frontend Bundle
        run: npm run build