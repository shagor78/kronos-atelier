version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kronos-ecommerce-app
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/app/database/ecommerce.sqlite
    volumes:
      - ecommerce_db_data:/app/database
      - ecommerce_logs:/app/logs
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kronos_net

  nginx:
    image: nginx:1.27-alpine
    container_name: kronos-ecommerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - kronos_net

volumes:
  ecommerce_db_data:
  ecommerce_logs:

networks:
  kronos_net:
    driver: bridge
